<nav class="bg-black/95 backdrop-blur-md border-b border-valorant-red/20 sticky top-0 z-50">
  <div class="max-w-full mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo -->
      <div class="flex items-center">
        <a routerLink="/" class="flex items-center group">
          <div class="w-10 h-10 bg-gradient-to-br from-valorant-red to-pink-600 flex items-center justify-center mr-3 transform group-hover:scale-110 transition-transform">
            <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20">
              <path d="M10 2L2 7l8 5 8-5-8-5zM2 17l8 5 8-5M2 12l8 5 8-5"/>
            </svg>
          </div>
          <span class="text-2xl font-bold tracking-tight">
            <span class="text-white">VALORANT</span>
            <span class="text-valorant-red ml-1">ARENA</span>
          </span>
        </a>
      </div>

      <!-- Desktop Navigation -->
      <div class="hidden lg:flex lg:items-center lg:space-x-1 flex-1 justify-center">
        <a routerLink="/" routerLinkActive="text-valorant-red bg-gray-900" 
           [routerLinkActiveOptions]="{exact: true}"
           class="text-gray-300 hover:text-white hover:bg-gray-900 px-3 py-2 text-xs font-medium uppercase tracking-wider transition-all whitespace-nowrap">
          Home
        </a>
        <a routerLink="/tournaments" routerLinkActive="text-valorant-red bg-gray-900"
           class="text-gray-300 hover:text-white hover:bg-gray-900 px-3 py-2 text-xs font-medium uppercase tracking-wider transition-all whitespace-nowrap">
          Tournaments
        </a>
        <a routerLink="/teams" routerLinkActive="text-valorant-red bg-gray-900"
           class="text-gray-300 hover:text-white hover:bg-gray-900 px-3 py-2 text-xs font-medium uppercase tracking-wider transition-all whitespace-nowrap">
          Teams
        </a>
        <a *ngIf="isAuthenticated()" routerLink="/scrims" routerLinkActive="text-valorant-red bg-gray-900"
           class="text-gray-300 hover:text-white hover:bg-gray-900 px-3 py-2 text-xs font-medium uppercase tracking-wider transition-all whitespace-nowrap">
          Scrims
        </a>
        <a *ngIf="isAuthenticated()" routerLink="/matchmaking" routerLinkActive="text-valorant-red bg-gray-900"
           class="text-gray-300 hover:text-white hover:bg-gray-900 px-3 py-2 text-xs font-medium uppercase tracking-wider transition-all whitespace-nowrap">
          Find Match
        </a>
        <a *ngIf="isAuthenticated()" routerLink="/dashboard" routerLinkActive="text-valorant-red bg-gray-900"
           class="text-gray-300 hover:text-white hover:bg-gray-900 px-3 py-2 text-xs font-medium uppercase tracking-wider transition-all whitespace-nowrap">
          Dashboard
        </a>
        <a *ngIf="isOrganizer()" routerLink="/tournaments/organizer" routerLinkActive="text-green-400 bg-gray-900"
           class="text-green-300 hover:text-green-200 hover:bg-gray-900 px-3 py-2 text-xs font-medium uppercase tracking-wider transition-all border border-green-500/30 rounded whitespace-nowrap">
          My Tournaments
        </a>
        <a *ngIf="isAdmin()" routerLink="/admin" routerLinkActive="text-yellow-400 bg-gray-900"
           class="text-yellow-300 hover:text-yellow-200 hover:bg-gray-900 px-3 py-2 text-xs font-medium uppercase tracking-wider transition-all border border-yellow-500/30 rounded whitespace-nowrap">
          Admin
        </a>
      </div>

      <!-- Desktop Auth Buttons -->
      <div class="hidden lg:flex lg:items-center lg:space-x-2">
        <div *ngIf="!isAuthenticated()" class="flex items-center space-x-2">
          <a routerLink="/login" class="text-gray-300 hover:text-white px-3 py-2 text-xs font-medium uppercase tracking-wider transition-colors whitespace-nowrap">
            Login
          </a>
          <a routerLink="/register" class="bg-gradient-to-r from-valorant-red to-pink-600 hover:from-red-600 hover:to-pink-700 text-white px-4 py-2 text-xs font-bold uppercase tracking-wider transition-all transform hover:scale-105 whitespace-nowrap">
            Sign Up
          </a>
        </div>
        <div *ngIf="isAuthenticated()" class="flex items-center space-x-2">
          <!-- Unified Notifications Bell -->
          <app-notification-bell></app-notification-bell>
          
          <a routerLink="/profile" class="flex items-center space-x-2 text-gray-300 hover:text-white transition-colors group">
            <img [src]="profilePictureUrl" 
                 alt="Avatar" 
                 (error)="onImageError($event)"
                 class="h-8 w-8 rounded-full border-2 border-gray-700 group-hover:border-valorant-red transition-colors">
            <span class="font-medium text-sm whitespace-nowrap">{{ currentUser?.username }}</span>
          </a>
          <button (click)="logout()" class="text-gray-400 hover:text-valorant-red transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Mobile Menu Button -->
      <div class="flex items-center md:hidden">
        <button (click)="toggleMenu()" class="inline-flex items-center justify-center p-2 text-gray-400 hover:text-white hover:bg-gray-900 transition-colors">
          <svg class="h-6 w-6" stroke="currentColor" fill="none" viewBox="0 0 24 24">
            <path *ngIf="!isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            <path *ngIf="isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div *ngIf="isMenuOpen" class="md:hidden bg-black/98 border-t border-gray-800">
    <div class="px-2 pt-2 pb-3 space-y-1">
      <a routerLink="/" (click)="toggleMenu()" 
         class="block px-3 py-3 text-base font-medium text-gray-300 hover:text-white hover:bg-gray-900 border-l-4 border-transparent hover:border-valorant-red transition-all uppercase tracking-wider">
        Home
      </a>
      <a routerLink="/tournaments" (click)="toggleMenu()"
         class="block px-3 py-3 text-base font-medium text-gray-300 hover:text-white hover:bg-gray-900 border-l-4 border-transparent hover:border-valorant-red transition-all uppercase tracking-wider">
        Tournaments
      </a>
      <a routerLink="/teams" (click)="toggleMenu()"
         class="block px-3 py-3 text-base font-medium text-gray-300 hover:text-white hover:bg-gray-900 border-l-4 border-transparent hover:border-valorant-red transition-all uppercase tracking-wider">
        Teams
      </a>
      <a *ngIf="isAuthenticated()" routerLink="/matchmaking" (click)="toggleMenu()"
         class="block px-3 py-3 text-base font-medium text-white bg-gradient-to-r from-valorant-red to-pink-600 border-l-4 border-valorant-red uppercase tracking-wider">
        <svg class="w-5 h-5 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        Find Match
      </a>
      <a *ngIf="isAuthenticated()" routerLink="/dashboard" (click)="toggleMenu()"
         class="block px-3 py-3 text-base font-medium text-gray-300 hover:text-white hover:bg-gray-900 border-l-4 border-transparent hover:border-valorant-red transition-all uppercase tracking-wider">
        Dashboard
      </a>
      <a *ngIf="isOrganizer()" routerLink="/tournaments/organizer" (click)="toggleMenu()"
         class="block px-3 py-3 text-base font-medium text-green-300 hover:text-white hover:bg-gray-900 border-l-4 border-green-500 transition-all uppercase tracking-wider">
        My Tournaments
      </a>
      <a *ngIf="isAdmin()" routerLink="/admin" (click)="toggleMenu()"
         class="block px-3 py-3 text-base font-medium text-yellow-300 hover:text-white hover:bg-gray-900 border-l-4 border-yellow-500 transition-all uppercase tracking-wider">
        Admin Panel
      </a>
    </div>
    <div class="pt-4 pb-3 border-t border-gray-800">
      <div *ngIf="!isAuthenticated()" class="px-2 space-y-1">
        <a routerLink="/login" (click)="toggleMenu()"
           class="block px-3 py-3 text-base font-medium text-gray-300 hover:text-white hover:bg-gray-900 uppercase tracking-wider">
          Login
        </a>
        <a routerLink="/register" (click)="toggleMenu()"
           class="block px-3 py-3 text-base font-bold text-white bg-gradient-to-r from-valorant-red to-pink-600 uppercase tracking-wider text-center">
          Sign Up
        </a>
      </div>
      <div *ngIf="isAuthenticated()" class="px-2 space-y-1">
        <a routerLink="/profile" (click)="toggleMenu()"
           class="flex items-center px-3 py-3 text-base font-medium text-gray-300 hover:text-white hover:bg-gray-900">
          <img [src]="profilePictureUrl" 
               alt="Avatar"
               (error)="onImageError($event)"
               class="h-8 w-8 rounded-full border-2 border-gray-700 mr-3">
          <span>{{ currentUser?.username }}</span>
        </a>
        <button (click)="logout(); toggleMenu()" 
                class="block w-full text-left px-3 py-3 text-base font-medium text-gray-300 hover:text-valorant-red hover:bg-gray-900 uppercase tracking-wider">
          Logout
        </button>
      </div>
    </div>
  </div>
</nav>
