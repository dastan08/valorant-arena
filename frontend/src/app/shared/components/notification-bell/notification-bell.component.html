<div class="relative">
  <!-- Notification Bell Button -->
  <button 
    (click)="toggleDropdown()"
    class="relative p-2 text-gray-300 hover:text-white transition-colors">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
    </svg>
    
    <!-- Unread Badge -->
    <span 
      *ngIf="unreadCount > 0"
      class="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/2 -translate-y-1/2 bg-valorant-red rounded-full">
      {{ unreadCount > 99 ? '99+' : unreadCount }}
    </span>
  </button>

  <!-- Dropdown -->
  <div 
    *ngIf="showDropdown"
    class="absolute right-0 mt-2 w-96 bg-gray-800 rounded-lg shadow-2xl border border-gray-700 z-50 max-h-[600px] overflow-hidden flex flex-col"
    (clickOutside)="closeDropdown()">
    
    <!-- Header -->
    <div class="flex items-center justify-between p-4 border-b border-gray-700">
      <h3 class="text-lg font-bold text-white">Notifications</h3>
      <button 
        *ngIf="unreadCount > 0"
        (click)="markAllAsRead()"
        class="text-sm text-valorant-red hover:text-red-400 transition-colors">
        Mark all read
      </button>
    </div>

    <!-- Notifications List -->
    <div class="overflow-y-auto flex-1">
      <div *ngIf="notifications.length === 0" class="p-8 text-center text-gray-400">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto mb-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
        </svg>
        <p class="text-lg font-semibold mb-1">No notifications</p>
        <p class="text-sm">You're all caught up!</p>
      </div>

      <div 
        *ngFor="let notification of notifications"
        (click)="handleNotificationClick(notification)"
        [class.bg-gray-750]="!notification.read"
        [class.bg-gray-800]="notification.read"
        class="p-4 border-b border-gray-700 hover:bg-gray-700 cursor-pointer transition-colors group">
        
        <div class="flex items-start gap-3">
          <!-- Icon -->
          <div class="flex-shrink-0 text-2xl">
            {{ getNotificationIcon(notification.type) }}
          </div>

          <!-- Content -->
          <div class="flex-1 min-w-0">
            <div class="flex items-start justify-between gap-2">
              <h4 class="text-sm font-semibold text-white truncate">
                {{ notification.title }}
              </h4>
              <button 
                (click)="deleteNotification(notification, $event)"
                class="flex-shrink-0 text-gray-500 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
            <p class="text-sm text-gray-300 mt-1">{{ notification.message }}</p>
            <div class="flex items-center justify-between mt-2">
              <span class="text-xs text-gray-500">{{ getTimeAgo(notification.timestamp) }}</span>
              <button 
                *ngIf="!notification.read"
                (click)="markAsRead(notification, $event)"
                class="text-xs text-valorant-red hover:text-red-400 transition-colors">
                Mark as read
              </button>
            </div>
          </div>

          <!-- Unread Indicator -->
          <div 
            *ngIf="!notification.read"
            class="flex-shrink-0 w-2 h-2 bg-valorant-red rounded-full mt-1">
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="p-3 border-t border-gray-700 bg-gray-850">
      <button 
        (click)="viewAll()"
        class="w-full text-center text-sm text-valorant-red hover:text-red-400 font-semibold transition-colors">
        View All Notifications
      </button>
    </div>
  </div>
</div>
