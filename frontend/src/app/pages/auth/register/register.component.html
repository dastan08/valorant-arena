<div class="min-h-screen flex items-center justify-center bg-valorant-dark py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8">
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-white">
        Create your account
      </h2>
      <p class="mt-2 text-center text-sm text-gray-400">
        Already have an account?
        <a routerLink="/login" class="font-medium text-valorant-red hover:text-red-500">
          Sign in
        </a>
      </p>
    </div>
    <form class="mt-8 space-y-6" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="rounded-md shadow-sm space-y-4">
        <div>
          <label for="username" class="block text-sm font-medium text-gray-300">Username</label>
          <input
            id="username"
            name="username"
            type="text"
            formControlName="username"
            required
            class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-700 placeholder-gray-500 text-white bg-gray-800 rounded-md focus:outline-none focus:ring-valorant-red focus:border-valorant-red sm:text-sm"
            placeholder="Username"
          />
          <div *ngIf="f['username'].invalid && (f['username'].dirty || f['username'].touched)" class="text-red-500 text-sm mt-1">
            <div *ngIf="f['username'].errors?.['required']">Username is required</div>
            <div *ngIf="f['username'].errors?.['minlength']">Username must be at least 3 characters</div>
          </div>
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-gray-300">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            formControlName="email"
            required
            class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-700 placeholder-gray-500 text-white bg-gray-800 rounded-md focus:outline-none focus:ring-valorant-red focus:border-valorant-red sm:text-sm"
            placeholder="Email address"
          />
          <div *ngIf="f['email'].invalid && (f['email'].dirty || f['email'].touched)" class="text-red-500 text-sm mt-1">
            <div *ngIf="f['email'].errors?.['required']">Email is required</div>
            <div *ngIf="f['email'].errors?.['email']">Email must be valid</div>
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-300">Password</label>
          <div class="relative mt-1">
            <input
              id="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              required
              class="appearance-none relative block w-full px-3 py-2 pr-10 border border-gray-700 placeholder-gray-500 text-white bg-gray-800 rounded-md focus:outline-none focus:ring-valorant-red focus:border-valorant-red sm:text-sm"
              placeholder="Password"
            />
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-white"
            >
              <svg *ngIf="!showPassword" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <svg *ngIf="showPassword" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
              </svg>
            </button>
          </div>
          <div *ngIf="f['password'].invalid && (f['password'].dirty || f['password'].touched)" class="text-red-500 text-sm mt-1">
            <div *ngIf="f['password'].errors?.['required']">Password is required</div>
            <div *ngIf="f['password'].errors?.['minlength']">Password must be at least 6 characters</div>
          </div>
        </div>

        <div>
          <label for="valorantId" class="block text-sm font-medium text-gray-300">Valorant ID</label>
          <input
            id="valorantId"
            name="valorantId"
            type="text"
            formControlName="valorantId"
            required
            class="mt-1 appearance-none relative block w-full px-3 py-2 border border-gray-700 placeholder-gray-500 text-white bg-gray-800 rounded-md focus:outline-none focus:ring-valorant-red focus:border-valorant-red sm:text-sm"
            placeholder="PlayerName#TAG"
          />
          <div *ngIf="f['valorantId'].invalid && (f['valorantId'].dirty || f['valorantId'].touched)" class="text-red-500 text-sm mt-1">
            <div *ngIf="f['valorantId'].errors?.['required']">Valorant ID is required</div>
          </div>
        </div>

        <div>
          <label for="rank" class="block text-sm font-medium text-gray-300">Current Rank</label>
          <select
            id="rank"
            name="rank"
            formControlName="rank"
            required
            class="mt-1 block w-full px-3 py-2 border border-gray-700 bg-gray-800 text-white rounded-md focus:outline-none focus:ring-valorant-red focus:border-valorant-red sm:text-sm"
          >
            <option value="">Select your rank</option>
            <option *ngFor="let rank of ranks" [value]="rank">{{ rank }}</option>
          </select>
          <div *ngIf="f['rank'].invalid && (f['rank'].dirty || f['rank'].touched)" class="text-red-500 text-sm mt-1">
            <div *ngIf="f['rank'].errors?.['required']">Rank is required</div>
          </div>
        </div>
      </div>

      <div>
        <button
          type="submit"
          [disabled]="loading || registerForm.invalid"
          class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-valorant-red hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-valorant-red disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span *ngIf="!loading">Create Account</span>
          <span *ngIf="loading">Creating Account...</span>
        </button>
      </div>
    </form>
  </div>
</div>
