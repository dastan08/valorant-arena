spring:
  application:
    name: valorant-arena
  
  datasource:
    url: jdbc:mysql://localhost:3306/valorant_arena?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:abcd}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:valorant-arena-super-secret-key-for-jwt-token-generation-minimum-256-bits-required}
  expiration: 86400000 # 24 hours in milliseconds

# CORS Configuration
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# Riot API & OAuth Configuration
riot:
  api:
    key: ${RIOT_API_KEY:your-riot-api-key}
    base-url: https://api.riotgames.com
    account-url: https://americas.api.riotgames.com
  oauth:
    client-id: ${RIOT_CLIENT_ID:your-riot-client-id}
    client-secret: ${RIOT_CLIENT_SECRET:your-riot-client-secret}
    redirect-uri: ${RIOT_REDIRECT_URI:http://localhost:4200/auth/riot/callback}
    authorization-uri: https://auth.riotgames.com/authorize
    token-uri: https://auth.riotgames.com/token
    user-info-uri: https://auth.riotgames.com/userinfo
    scope: openid

# Discord OAuth Configuration
discord:
  client-id: ${DISCORD_CLIENT_ID:your-discord-client-id}
  client-secret: ${DISCORD_CLIENT_SECRET:your-discord-client-secret}
  redirect-uri: http://localhost:4200/auth/discord/callback
  bot:
    token: ${DISCORD_BOT_TOKEN:your-discord-bot-token}

# Logging
logging:
  level:
    com.valorantarena: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/valorant-arena.log
# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
