# Production Configuration for AWS RDS
spring:
  # Import secrets file
  config:
    import:
      - optional:file:./application-secrets.yml
      - optional:classpath:application-secrets.yml
  
  datasource:
    url: ${DB_URL:jdbc:mysql://valorant-arena.cxy4ycyyyyvy.ap-south-1.rds.amazonaws.com:3306/valorant_arena?useSSL=true&requireSSL=true&serverTimezone=UTC}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate  # Use 'validate' in production, not 'update'
    show-sql: false  # Disable SQL logging in production
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

# Logging for production
logging:
  level:
    com.valorantarena: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  file:
    name: /var/log/valorant-arena/application.log
    max-size: 10MB
    max-history: 30
