# Test Configuration
# Uses H2 in-memory database for testing

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  
  h2:
    console:
      enabled: false

# JWT Configuration for testing
jwt:
  secret: test-secret-key-for-jwt-token-generation-minimum-256-bits-required-for-testing
  expiration: 86400000

# CORS Configuration for testing
cors:
  allowed-origins: http://localhost:4200
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# Riot API Configuration (mock values for testing)
riot:
  api:
    key: test-riot-api-key
    base-url: https://api.riotgames.com
    account-url: https://americas.api.riotgames.com
  oauth:
    client-id: test-riot-client-id
    client-secret: test-riot-client-secret
    redirect-uri: http://localhost:4200/auth/riot/callback
    authorization-uri: https://auth.riotgames.com/authorize
    token-uri: https://auth.riotgames.com/token
    user-info-uri: https://auth.riotgames.com/userinfo
    scope: openid

# Discord OAuth Configuration (mock values for testing)
discord:
  client-id: 123456789012345678
  client-secret: test-discord-client-secret
  redirect-uri: http://localhost:4200/auth/discord/callback
  bot:
    token: test-discord-bot-token

# Logging for tests
logging:
  level:
    com.valorantarena: WARN
    org.springframework: WARN
    org.hibernate: WARN
